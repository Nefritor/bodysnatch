name: mac-smoke

# Отладка macOS-версии без Mac: собирает приложение на macOS-раннере, смотрит подпись и запускает его.
on:
  workflow_dispatch:
  push:
    branches: [mac-debug]

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Сборка dmg (arm64)
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Подпись и Gatekeeper (как скачано из браузера)
        run: |
          DMG=$(ls release/*-mac-arm64.dmg)
          xattr -w com.apple.quarantine "0083;5f5f5f5f;Chrome;" "$DMG"
          hdiutil attach "$DMG" -mountpoint /Volumes/BS -nobrowse -quiet
          cp -R /Volumes/BS/BodySnatch.app "$RUNNER_TEMP/BodySnatch.app"
          hdiutil detach /Volumes/BS -quiet
          APP="$RUNNER_TEMP/BodySnatch.app"
          echo "== codesign"; codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo "== codesign --verify (должно пройти без ошибок)"; codesign --verify --deep --strict --verbose=2 "$APP" 2>&1
          echo "== spctl (ad-hoc без нотаризации: rejected — ожидаемо)"; spctl -a -vv "$APP" 2>&1 || true
          xattr -cr "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Запуск приложения
        run: |
          export BODYSNATCH_DATA_DIR="$RUNNER_TEMP/bs-data"
          "$APP/Contents/MacOS/BodySnatch" > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          for attempt in $(seq 1 30); do
            [ -f "$BODYSNATCH_DATA_DIR/control-api.json" ] && break
            sleep 1
          done
          kill -0 "$(cat "$RUNNER_TEMP/app.pid")"
          node scripts/bodysnatch-api.mjs GET /api/capabilities
          node scripts/bodysnatch-api.mjs GET /api/state > "$RUNNER_TEMP/state.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            import assert from 'node:assert/strict';
            const state = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/state.json'));
            assert.equal(state.platform, 'darwin');
            assert.equal(state.enabled, false);
            assert.equal(state.version, JSON.parse(fs.readFileSync('package.json')).version);
            console.log('macOS API and packaged engine: OK');
          "
          echo "== вывод приложения"; cat "$RUNNER_TEMP/app.log" || true
          echo "== shell.log"; cat "$BODYSNATCH_DATA_DIR/shell.log" 2>&1 || true
          screencapture -x "$RUNNER_TEMP/screen.png" || true
          echo "== отчёты о падениях"; ls -la ~/Library/Logs/DiagnosticReports 2>&1 || true
          for f in ~/Library/Logs/DiagnosticReports/BodySnatch*; do [ -f "$f" ] && { echo "--- $f"; head -80 "$f"; }; done || true

      - name: Корректный выход
        if: always()
        env:
          BODYSNATCH_DATA_DIR: ${{ runner.temp }}/bs-data
        run: node scripts/bodysnatch-api.mjs POST /api/quit || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: |
            ${{ runner.temp }}/app.log
            ${{ runner.temp }}/bs-data/shell.log
            ${{ runner.temp }}/screen.png
          if-no-files-found: warn
