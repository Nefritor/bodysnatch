name: mac-smoke

# Отладка macOS-версии без Mac: собирает приложение на macOS-раннере, смотрит подпись и запускает его.
on:
  workflow_dispatch:
  push:
    branches: [mac-debug]

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Сборка .app (arm64)
        run: npx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Подпись и Gatekeeper (как скачано из браузера)
        run: |
          APP="release/mac-arm64/BodySnatch.app"
          echo "== codesign до подписи"; codesign -dv --verbose=4 "$APP" 2>&1 || true
          echo "== codesign --verify"; codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true
          xattr -w com.apple.quarantine "0083;5f5f5f5f;Chrome;" "$APP"
          echo "== spctl с карантином (без подписи)"; spctl -a -vv "$APP" 2>&1 || true
          codesign --force --deep --sign - "$APP"
          echo "== codesign после ad-hoc"; codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo "== spctl с карантином (ad-hoc)"; spctl -a -vv "$APP" 2>&1 || true
          xattr -cr "$APP"

      - name: Запуск приложения
        run: |
          APP="release/mac-arm64/BodySnatch.app"
          export BODYSNATCH_DATA_DIR="$RUNNER_TEMP/bs-data"
          "$APP/Contents/MacOS/BodySnatch" --remote-debugging-port=9333 > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          sleep 12
          echo "== процесс жив?"; (kill -0 "$(cat "$RUNNER_TEMP/app.pid")" && echo да) || echo НЕТ
          echo "== вывод приложения"; cat "$RUNNER_TEMP/app.log" || true
          echo "== shell.log"; cat "$BODYSNATCH_DATA_DIR/shell.log" 2>&1 || true
          echo "== проверка окна"; node scripts/smoke-check.mjs 9333 || true
          screencapture -x "$RUNNER_TEMP/screen.png" || true
          echo "== отчёты о падениях"; ls -la ~/Library/Logs/DiagnosticReports 2>&1 || true
          for f in ~/Library/Logs/DiagnosticReports/BodySnatch*; do [ -f "$f" ] && { echo "--- $f"; head -80 "$f"; }; done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke
          path: |
            ${{ runner.temp }}/app.log
            ${{ runner.temp }}/bs-data/shell.log
            ${{ runner.temp }}/screen.png
          if-no-files-found: warn
